<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>モンハン漢字タイピング検定 - 全モンスター網羅完全版</title>
  <style>
    :root {
      --bg-dark: #0f0f13;
      --panel-bg: rgba(26, 26, 36, 0.94);
      --border-gold: #c5a059;
      --border-dark: #3a3224;
      --text-main: #f0e6d2;
      --text-muted: #9e917d;
      --accent-red: #d93838;
      --accent-green: #38b000;
      --gold-glow: 0 0 12px rgba(197, 160, 89, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(40, 30, 20, 0.6) 0%, rgba(10, 10, 15, 0.95) 80%),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.2) 2px, rgba(0, 0, 0, 0.2) 4px);
      color: var(--text-main);
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'MS PMincho', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--panel-bg);
      border: 3px double var(--border-gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), var(--gold-glow);
      border-radius: 4px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(197, 160, 89, 0.2);
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--border-gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-dark);
      padding-bottom: 12px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 設定フォーム */
    .setting-group {
      margin-bottom: 18px;
    }

    .setting-title {
      font-size: 1rem;
      color: var(--border-gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .btn-radio {
      background: rgba(15, 15, 20, 0.6);
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
      padding: 10px 14px;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .btn-radio:hover {
      border-color: var(--border-gold);
      color: var(--text-main);
    }

    .btn-radio.selected {
      background: rgba(197, 160, 89, 0.2);
      border-color: var(--border-gold);
      color: #fff;
      font-weight: bold;
      box-shadow: var(--gold-glow);
    }

    .btn-action {
      width: 100%;
      background: linear-gradient(180deg, #c5a059 0%, #8c6a2f 100%);
      border: 1px solid #ffd700;
      color: #111;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
      text-shadow: 0 1px 1px rgba(255,255,255,0.4);
      transition: all 0.2s;
    }

    .btn-action:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    /* ゲーム画面 HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.4);
      padding: 8px 14px;
      border: 1px solid var(--border-dark);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .hud-val {
      color: var(--border-gold);
      font-weight: bold;
    }

    /* 出題表示エリア */
    .question-box {
      background: radial-gradient(circle, rgba(35, 25, 20, 0.9) 0%, rgba(15, 15, 20, 0.95) 100%);
      border: 2px solid var(--border-gold);
      border-radius: 6px;
      padding: 30px 20px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
    }

    .q-category {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: rgba(0,0,0,0.5);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .q-kanji {
      font-size: 2.8rem;
      letter-spacing: 4px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3), 2px 2px 4px #000;
      margin: 10px 0;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .q-hint {
      font-size: 0.9rem;
      color: #ffd700;
      min-height: 24px;
    }

    /* 入力フォーム */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(10, 10, 15, 0.9);
      border: 2px solid var(--border-dark);
      color: #fff;
      font-size: 1.2rem;
      padding: 10px 14px;
      border-radius: 4px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--border-gold);
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.3);
    }

    .btn-sub {
      background: rgba(40, 35, 30, 0.8);
      border: 1px solid var(--border-gold);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn-sub:hover:not(:disabled) {
      background: rgba(197, 160, 89, 0.3);
      color: #fff;
    }

    .btn-sub:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .msg-area {
      min-height: 28px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .msg-correct { color: var(--accent-green); }
    .msg-wrong { color: var(--accent-red); }

    /* リザルト画面 */
    .result-rank {
      text-align: center;
      margin: 20px 0;
    }

    .rank-title {
      font-size: 1rem;
      color: var(--text-muted);
    }

    .rank-name {
      font-size: 2rem;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      margin-top: 6px;
    }

    .score-detail {
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .review-list {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border-dark);
      padding: 10px;
      background: rgba(10, 10, 15, 0.6);
      border-radius: 4px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .review-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 4px 0;
    }

    .review-item span.ok { color: var(--accent-green); }
    .review-item span.ng { color: var(--accent-red); }

    .sound-toggle {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.2rem;
    }

    @media (max-width: 480px) {
      .q-kanji { font-size: 2rem; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="container">
  <button id="btnSound" class="sound-toggle" title="音量切替">🔊</button>
  <h1>モンハン漢字タイピング検定</h1>

  <!-- 設定画面 -->
  <div id="screenSetup" class="screen active">
    <div class="setting-group">
      <div class="setting-title">⚔️ 出題ジャンル</div>
      <div class="options-grid" id="optCategory">
        <div class="btn-radio selected" data-value="all">すべて</div>
        <div class="btn-radio" data-value="monster">モンスター (160+種)</div>
        <div class="btn-radio" data-value="weapon">武器</div>
        <div class="btn-radio" data-value="armor">防具</div>
        <div class="btn-radio" data-value="item">アイテム・素材</div>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-title">📜 難易度</div>
      <div class="options-grid" id="optDiff">
        <div class="btn-radio selected" data-value="easy">
          かんたん<br><small style="font-size:0.75rem; opacity:0.8;">(カタカナ名もOK)</small>
        </div>
        <div class="btn-radio" data-value="hard">
          むずかしい<br><small style="font-size:0.75rem; opacity:0.8;">(漢字読み限定)</small>
        </div>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-title">💡 ヒント機能</div>
      <div class="options-grid" id="optHint">
        <div class="btn-radio selected" data-value="on">ON</div>
        <div class="btn-radio" data-value="off">OFF (封印)</div>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-title">🎯 出題数</div>
      <div class="options-grid" id="optCount">
        <div class="btn-radio selected" data-value="5">5問</div>
        <div class="btn-radio" data-value="10">10問</div>
        <div class="btn-radio" data-value="20">20問</div>
        <div class="btn-radio" data-value="50">50問</div>
      </div>
    </div>

    <button class="btn-action" id="btnStart">クエスト受注（開始）</button>
  </div>

  <!-- プレイ画面 -->
  <div id="screenPlay" class="screen">
    <div class="hud">
      <div>問題: <span id="hudCurrent" class="hud-val">1</span> / <span id="hudTotal" class="hud-val">10</span></div>
      <div>難易度: <span id="hudDiff" class="hud-val">かんたん</span></div>
      <div>ヒント: <span id="hudHintStatus" class="hud-val">ON</span></div>
    </div>

    <div class="question-box">
      <div class="q-category" id="qCategory">モンスター</div>
      <div class="q-kanji" id="qKanji">雄火竜</div>
      <div class="q-hint" id="qHint"></div>
    </div>

    <div class="input-group">
      <input type="text" id="answerInput" placeholder="読みを入力（ひらがな・カタカナ）" autocomplete="off" />
      <button class="btn-sub" id="btnSubmit">解答</button>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
      <button class="btn-sub" id="btnHint" style="flex:1;">💡 1文字目ヒント</button>
      <button class="btn-sub" id="btnGiveUp" style="flex:1;">🏳️ 降参（答えを見る）</button>
    </div>

    <div class="msg-area" id="msgArea"></div>
  </div>

  <!-- リザルト画面 -->
  <div id="screenResult" class="screen">
    <div class="result-rank">
      <div class="rank-title">ハンター称号授与</div>
      <div class="rank-name" id="resultRank">G級ハンター</div>
    </div>

    <div class="score-detail">
      正解数: <span id="resCorrect">0</span> / <span id="resTotal">0</span> 問<br>
      正答率: <span id="resRate">0</span> %
    </div>

    <div class="review-list" id="reviewList"></div>

    <button class="btn-action" id="btnRestart">拠点に戻る（再挑戦）</button>
  </div>
</div>

// --- Web Audio API (SE) ---
class SoundManager {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  playCorrect() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.1); // E5
    osc.frequency.setValueAtTime(783.99, this.ctx.currentTime + 0.2); // G5
    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.4);
  }
  playWrong() {
    if (this.muted) return;
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }
}

const snd = new SoundManager();

// --- アプリケーション状態 ---
let state = {
  category: "all",
  difficulty: "easy",
  hintEnabled: true,
  totalQuestions: 5,
  currentIndex: 0,
  score: 0,
  questions: [],
  history: []
};

// --- DOMエレメント ---
const screens = {
  setup: document.getElementById("screenSetup"),
  play: document.getElementById("screenPlay"),
  result: document.getElementById("screenResult")
};

// --- ラジオボタン制御 helper ---
function setupRadioGroup(groupId, callback) {
  const container = document.getElementById(groupId);
  container.addEventListener("click", (e) => {
    const btn = e.target.closest(".btn-radio");
    if (!btn) return;
    container.querySelectorAll(".btn-radio").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    callback(btn.dataset.value);
  });
}

setupRadioGroup("optCategory", v => state.category = v);
setupRadioGroup("optDiff", v => state.difficulty = v);
setupRadioGroup("optHint", v => state.hintEnabled = (v === "on"));
setupRadioGroup("optCount", v => state.totalQuestions = parseInt(v));

// --- 画面切り替え ---
function showScreen(name) {
  Object.keys(screens).forEach(k => screens[k].classList.remove("active"));
  screens[name].classList.add("active");
}

// --- ひらがな/カタカナ正規化 helper ---
function normalizeInput(str) {
  return str
    .trim()
    .replace(/[\u30a1-\u30f6]/g, match => String.fromCharCode(match.charCodeAt(0) - 0x60)) // カタカナ→ひらがな
    .replace(/[・\s ]/g, ""); // スペースやドット消去
}

// --- クエスト開始 ---
document.getElementById("btnStart").addEventListener("click", () => {
  let filtered = KANJI_DATABASE;
  if (state.category !== "all") {
    filtered = KANJI_DATABASE.filter(item => item.cat === state.category);
  }

  if (filtered.length === 0) {
    alert("該当するカテゴリのデータがありません");
    return;
  }

  // シャッフル
  const shuffled = [...filtered].sort(() => Math.random() - 0.5);
  state.questions = shuffled.slice(0, Math.min(state.totalQuestions, shuffled.length));
  state.currentIndex = 0;
  state.score = 0;
  state.history = [];

  // UI初期化
  document.getElementById("hudTotal").textContent = state.questions.length;
  document.getElementById("hudDiff").textContent = state.difficulty === "easy" ? "かんたん" : "むずかしい";
  document.getElementById("hudHintStatus").textContent = state.hintEnabled ? "ON" : "OFF";
  
  const hintBtn = document.getElementById("btnHint");
  hintBtn.style.display = state.hintEnabled ? "block" : "none";

  showScreen("play");
  loadQuestion();
});

// --- 問題の読み込み ---
function loadQuestion() {
  const current = state.questions[state.currentIndex];
  document.getElementById("hudCurrent").textContent = state.currentIndex + 1;
  document.getElementById("qKanji").textContent = current.kanji;
  
  const catNames = { monster: "モンスター", weapon: "武器", armor: "防具", item: "アイテム・素材" };
  document.getElementById("qCategory").textContent = catNames[current.cat] || "クエスト";
  
  document.getElementById("qHint").textContent = "";
  document.getElementById("answerInput").value = "";
  document.getElementById("msgArea").textContent = "";
  document.getElementById("answerInput").focus();
}

// --- 解答処理 ---
function checkAnswer(isGiveUp = false) {
  const current = state.questions[state.currentIndex];
  const inputRaw = document.getElementById("answerInput").value;
  const inputNorm = normalizeInput(inputRaw);

  const targetReadNorm = normalizeInput(current.read);
  const targetKataNorm = current.katakana ? normalizeInput(current.katakana) : "";

  let isCorrect = false;

  if (!isGiveUp) {
    if (state.difficulty === "easy") {
      // かんたん：漢字読み 兼 カタカナ名 どちらでも正解
      if (inputNorm === targetReadNorm || (targetKataNorm && inputNorm === targetKataNorm)) {
        isCorrect = true;
      }
    } else {
      // むずかしい：漢字読み限定
      if (inputNorm === targetReadNorm) {
        isCorrect = true;
      }
    }
  }

  const msgArea = document.getElementById("msgArea");

  if (isCorrect) {
    snd.playCorrect();
    msgArea.className = "msg-area msg-correct";
    msgArea.textContent = "一本！ 正解！";
    state.score++;
  } else {
    snd.playWrong();
    msgArea.className = "msg-area msg-wrong";
    let correctStr = current.read;
    if (current.katakana) correctStr += ` (${current.katakana})`;
    msgArea.textContent = isGiveUp ? `【正解: ${correctStr}】` : `不正解...【正解: ${correctStr}】`;
  }

  state.history.push({
    kanji: current.kanji,
    correctRead: current.read,
    isCorrect: isCorrect
  });

  // 次の問題へ
  setTimeout(() => {
    state.currentIndex++;
    if (state.currentIndex < state.questions.length) {
      loadQuestion();
    } else {
      showResult();
    }
  }, 1600);
}

document.getElementById("btnSubmit").addEventListener("click", () => checkAnswer(false));
document.getElementById("answerInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") checkAnswer(false);
});
document.getElementById("btnGiveUp").addEventListener("click", () => checkAnswer(true));

// --- ヒント機能 ---
document.getElementById("btnHint").addEventListener("click", () => {
  if (!state.hintEnabled) return;
  const current = state.questions[state.currentIndex];
  const firstChar = current.read.charAt(0);
  document.getElementById("qHint").textContent = `ヒント: 最初の文字は「 ${firstChar} 」`;
});

// --- リザルト表示 ---
function showResult() {
  showScreen("result");
  const total = state.questions.length;
  const rate = Math.round((state.score / total) * 100);

  document.getElementById("resCorrect").textContent = state.score;
  document.getElementById("resTotal").textContent = total;
  document.getElementById("resRate").textContent = rate;

  // 階級判定
  let rank = "駆け出しハンター";
  if (rate === 100) rank = "伝説のギルドマスター";
  else if (rate >= 80) rank = "G級ハンター";
  else if (rate >= 60) rank = "上位ハンター";
  else if (rate >= 40) rank = "下位ハンター";
  document.getElementById("resultRank").textContent = rank;

  // 振り返りリスト
  const listEl = document.getElementById("reviewList");
  listEl.innerHTML = "";
  state.history.forEach(item => {
    const div = document.createElement("div");
    div.className = "review-item";
    div.innerHTML = `
      <span>${item.kanji} (${item.correctRead})</span>
      <span class="${item.isCorrect ? 'ok' : 'ng'}">${item.isCorrect ? '◯ 正解' : '✕ 不正解'}</span>
    `;
    listEl.appendChild(div);
  });
}

document.getElementById("btnRestart").addEventListener("click", () => {
  showScreen("setup");
});

// ミュートボタン
document.getElementById("btnSound").addEventListener("click", (e) => {
  snd.muted = !snd.muted;
  e.target.textContent = snd.muted ? "🔇" : "🔊";
});
